[package]
name = "anvil-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anvil-core = { workspace = true }
anvil-sys = { workspace = true }
anvil-secret = { workspace = true }
anyhow = { workspace = true }
